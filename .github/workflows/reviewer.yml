name: reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: reviewer-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    if: >-
      github.event.pull_request.draft != true
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      reviews: ${{ steps.list.outputs.reviews }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-uv
      - id: list
        run: |
          output=$(uv run reviewer review list --format json)
          reviews=$(printf '%s' "$output" | jq -c '.data.keys')
          count=$(printf '%s' "$output" | jq '.data.count')
          {
            echo "reviews=$reviews"
            echo "count=$count"
          } >> "$GITHUB_OUTPUT"

  review:
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        review: ${{ fromJson(needs.discover.outputs.reviews) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-python-uv

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install claude-code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run reviewer and post summary comment
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVIEW_KEY: ${{ matrix.review }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          status=0
          output=$(uv run reviewer review run "$REVIEW_KEY" \
            --base-ref "$BASE_REF" \
            --review-format findings \
            --format json) || status=$?

          echo "--- reviewer envelope ---"
          printf '%s\n' "$output"
          echo "--- end reviewer envelope ---"

          printf '%s' "$output" \
            | uv run reviewer exec format-findings-comment \
            | gh pr comment "$PR_NUMBER" --body-file -

          exit "$status"
