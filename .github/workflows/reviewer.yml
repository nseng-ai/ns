name: reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: reviewer-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    if: >-
      github.event.pull_request.draft != true
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      reviews: ${{ steps.list.outputs.reviews }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-uv
      - id: list
        run: |
          output=$(uv run reviewer review list --format json)
          reviews=$(printf '%s' "$output" | jq -c '.data.keys')
          count=$(printf '%s' "$output" | jq '.data.count')
          {
            echo "reviews=$reviews"
            echo "count=$count"
          } >> "$GITHUB_OUTPUT"

  review:
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        review: ${{ fromJson(needs.discover.outputs.reviews) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-python-uv

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install claude-code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run reviewer and publish surfaces
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVIEW_KEY: ${{ matrix.review }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          status=0
          output=$(uv run reviewer review run "$REVIEW_KEY" \
            --base-ref "$BASE_REF" \
            --review-format findings \
            --format json) || status=$?

          echo "--- reviewer envelope ---"
          printf '%s\n' "$output"
          echo "--- end reviewer envelope ---"

          # Publish the two surfaces independently. set +e around each so a
          # failure in one does not prevent the other from running (plan
          # invariant #3 — "minimal PR noise" hinges on the check surface
          # always being reachable; invariant #4 — "full visibility" hinges
          # on the summary comment still landing if the check run fails).
          set +e
          printf '%s' "$output" \
            | uv run reviewer exec format-findings-comment \
            | uv run reviewer exec post-findings-comment \
                --pr-number "$PR_NUMBER" \
                --run-url "$run_url"
          comment_status=$?

          printf '%s' "$output" \
            | uv run reviewer exec post-findings-check \
                --head-sha "$HEAD_SHA" \
                --review-key "$REVIEW_KEY" \
                --run-url "$run_url"
          check_status=$?
          set -e

          if [ "$comment_status" -ne 0 ]; then
            echo "post-findings-comment failed with exit $comment_status" >&2
          fi
          if [ "$check_status" -ne 0 ]; then
            echo "post-findings-check failed with exit $check_status" >&2
          fi

          # Surface any publish failure as a job failure, but only after both
          # have had a chance to run. If both published OK, bubble the
          # reviewer run status (which may itself be non-zero for harness
          # errors).
          if [ "$comment_status" -ne 0 ] || [ "$check_status" -ne 0 ]; then
            exit 1
          fi
          exit "$status"
