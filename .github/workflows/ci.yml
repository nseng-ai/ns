name: ci

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-typescript
      - name: Run TypeScript dependency governance
        run: just ts-deps-check
      - name: Run TypeScript format check
        run: just ts-format-check
      - name: Run TypeScript lint
        run: just ts-lint
      - name: Run native TypeScript 7 (tsc) typecheck
        run: just ts-check
      - name: Run TypeScript tests
        run: just ts-test

  typescript-integration:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-typescript
      - name: Install integration test system dependencies
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 \( -name 'azure-cli*' -o -name 'microsoft-prod*' \) -delete
          sudo apt-get update
          sudo apt-get install -y sqlite3
      - name: Run TypeScript integration tests
        run: just ts-test-integration

  typescript-isolated:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-typescript
      - name: Run isolated TypeScript tests
        run: just ts-test-isolated

  typescript-style-guard:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-typescript
      - name: Run TypeScript style guard tests
        run: just ts-test-typescript-style-guard

  skill-exposure-check:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-typescript
      - name: Check skill exposure policy
        run: just skill-exposure-check

  objective-check:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-typescript
      - name: Run Objective edge sweep
        run: just objective-check
