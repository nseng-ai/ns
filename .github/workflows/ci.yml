name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-typescript
      - name: Run TypeScript dependency governance
        run: just ts-deps-check
      - name: Run TypeScript format check
        run: just ts-format-check
      - name: Run TypeScript lint
        run: just ts-lint
      - name: Run native TypeScript 7 (tsc) typecheck
        run: just ts-check
      - name: Run TypeScript tests
        run: just ts-test

  typescript-integration:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-typescript
      - name: Install integration test system dependencies
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 \( -name 'azure-cli*' -o -name 'microsoft-prod*' \) -delete
          sudo apt-get update
          sudo apt-get install -y sqlite3
      - name: Run TypeScript integration tests
        run: just ts-test-integration

  typescript-isolated:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-typescript
      - name: Run isolated TypeScript tests
        run: just ts-test-isolated

  typescript-style-guard:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-typescript
      - name: Run TypeScript style guard tests
        run: just ts-test-typescript-style-guard

  docs-build:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: 26.3.0
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - name: Install docs dependencies
        run: pnpm --dir docs-site install --frozen-lockfile
      - name: Run docs typecheck
        run: pnpm --dir docs-site run check
      - name: Build docs site
        run: pnpm --dir docs-site run build

  areg-check:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-typescript
      - name: Run areg check
        run: just areg-check

  objective-check:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-typescript
      - name: Run Objective edge sweep
        run: just objective-check
