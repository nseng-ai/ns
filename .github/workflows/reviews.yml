name: reviews

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: reviews-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    if: >-
      github.event.pull_request.draft != true
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      reviews: ${{ steps.list.outputs.reviews }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: "26.3.0"
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml

      - name: Install TS workspace dependencies
        run: pnpm --config.strict-dep-builds=false --dir ts install --frozen-lockfile

      - name: Add TS workspace binaries to PATH
        run: echo "$GITHUB_WORKSPACE/ts/node_modules/.bin" >> "$GITHUB_PATH"

      - id: list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "${PR_NUMBER:-}" ]; then
            BASE_REF=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefName --jq .baseRefName)
          else
            BASE_REF="${{ github.event.pull_request.base.ref }}"
          fi
          git fetch origin "$BASE_REF:refs/remotes/origin/$BASE_REF"

          status=0
          output=$(node "$GITHUB_WORKSPACE/ts/packages/hosts/ns/src/cli.ts" reviews list --ci --applicable --base-ref "$BASE_REF" --format json) || status=$?
          if [ "$status" -ne 0 ]; then
            printf '%s\n' "$output"
            exit "$status"
          fi

          reviews=$(printf '%s' "$output" | jq -c '.data.keys')
          count=$(printf '%s' "$output" | jq '.data.count')
          {
            echo "reviews=$reviews"
            echo "count=$count"
          } >> "$GITHUB_OUTPUT"

  review:
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        review: ${{ fromJson(needs.discover.outputs.reviews) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: "26.3.0"
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml

      - name: Install TS workspace dependencies
        run: pnpm --config.strict-dep-builds=false --dir ts install --frozen-lockfile

      - name: Add TS workspace binaries to PATH
        run: |
          echo "$GITHUB_WORKSPACE/ts/node_modules/.bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ts/packages/hosts/ns/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Verify pinned Pi review harness
        run: pi --version

      - name: Run reviews and post summary comment
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          REVIEW_KEY: ${{ matrix.review }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        shell: bash
        run: |
          set -euo pipefail

          pr_context=$(gh pr view "$PR_NUMBER" --json baseRefName,headRefOid)
          BASE_REF=$(jq -r .baseRefName <<< "$pr_context")
          PR_HEAD_SHA=$(jq -r .headRefOid <<< "$pr_context")
          git fetch origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
          git fetch origin "$PR_HEAD_SHA"
          BASE_MERGE_BASE_SHA=$(git merge-base "origin/$BASE_REF" "$PR_HEAD_SHA")

          status=0
          output=$(node "$GITHUB_WORKSPACE/ts/packages/hosts/ns/src/cli.ts" reviews run "$REVIEW_KEY" \
            --base-ref "$BASE_REF" \
            --log-branch "$GITHUB_HEAD_REF" \
            --prior-findings-pr-number "$PR_NUMBER" \
            --format json) || status=$?

          echo "--- reviews envelope ---"
          printf '%s\n' "$output"
          echo "--- end reviews envelope ---"

          printf '%s' "$output" | node "$GITHUB_WORKSPACE/ts/packages/hosts/ns/src/cli.ts" reviews exec publish-findings \
            --pr-number "$PR_NUMBER" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --review-name "$REVIEW_KEY" \
            --base-ref "$BASE_REF" \
            --reviewed-head-sha "$PR_HEAD_SHA" \
            --reviewed-base-merge-base-sha "$BASE_MERGE_BASE_SHA"

          exit "$status"
