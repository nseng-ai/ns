name: roaster

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: roaster-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    if: >-
      github.event.pull_request.draft != true
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      reviews: ${{ steps.list.outputs.reviews }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-uv
      - id: list
        run: |
          output=$(uv run roaster review list --format json)
          reviews=$(printf '%s' "$output" | jq -c '.data.keys')
          count=$(printf '%s' "$output" | jq '.data.count')
          {
            echo "reviews=$reviews"
            echo "count=$count"
          } >> "$GITHUB_OUTPUT"

  review:
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        review: ${{ fromJson(needs.discover.outputs.reviews) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-python-uv

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install claude-code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run roaster and post summary comment
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVIEW_KEY: ${{ matrix.review }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          BASE_REF=$(gh pr view "$PR_NUMBER" --json baseRefName --jq .baseRefName)

          roaster_output_file=$(mktemp)
          inline_result_file=$(mktemp)
          trap 'rm -f "$roaster_output_file" "$inline_result_file"' EXIT

          status=0
          output=$(uv run roaster review run "$REVIEW_KEY" \
            --base-ref "$BASE_REF" \
            --review-format findings \
            --format json) || status=$?
          printf '%s' "$output" > "$roaster_output_file"

          echo "--- roaster envelope ---"
          printf '%s\n' "$output"
          echo "--- end roaster envelope ---"

          uv run roaster exec post-inline-findings \
            --pr-number "$PR_NUMBER" \
            < "$roaster_output_file" \
            > "$inline_result_file"

          uv run roaster exec format-findings-comment \
            --inline-result-file "$inline_result_file" \
            < "$roaster_output_file" \
            | uv run roaster exec post-findings-comment \
                --pr-number "$PR_NUMBER" \
                --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          exit "$status"
