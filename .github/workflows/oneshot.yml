name: oneshot

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: "Branch containing queued branch memory for oneshot."
        required: true
        type: string
      pr_number:
        description: "Draft PR number created before dispatch."
        required: true
        type: string
      submitted_by:
        description: "GitHub username that queued the oneshot request."
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: oneshot-${{ inputs.branch_name }}
  cancel-in-progress: true

jobs:
  queued:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch_name }}
          fetch-depth: 0

      - name: Validate branch-memory contract
        run: test -f .twerk/branch-memory/oneshot/prompt.md

      - name: Log queued prompt
        run: |
          echo "PR #${{ inputs.pr_number }} queued by ${{ inputs.submitted_by }}"
          wc -c .twerk/branch-memory/oneshot/prompt.md
