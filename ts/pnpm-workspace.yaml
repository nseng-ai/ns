# ADR 0045: the three release-disposition roots are the only package homes. Discovery
# is narrowed to them so a package added outside a disposition root is not silently
# ingested as a workspace project.
packages:
  - packages/public/**
  - packages/incubating/**
  - packages/internal/**
  # Build output contains a generated publish manifest with the same name as its
  # source package. Recursive discovery would ingest it as a second workspace
  # project that silently shadows the real one.
  - '!packages/**/dist/**'

allowBuilds:
  '@google/genai': true
  '@swc/core': true
  cbor-extract: false
  esbuild: true
  protobufjs: true

catalog:
  '@earendil-works/pi-agent-core': 0.80.5
  '@earendil-works/pi-ai': 0.80.5
  '@earendil-works/pi-coding-agent': 0.80.5
  '@earendil-works/pi-tui': 0.80.5
  '@pierre/diffs': ^1.2.10
  '@types/node': ^24.0.0
  '@typescript/native': npm:typescript@^7.0.2
  '@withgraphite/graphite-cli': ^1.8.6
  '@xterm/headless': ^6.0.0
  ansis: ^4.3.1
  commander: ^14.0.0
  esbuild: ^0.27.0
  jiti: 2.7.0
  jsonc-parser: ^3.3.1
  log-update: ^8.0.0
  oxfmt: ^0.55.0
  oxlint: ^1.70.0
  smol-toml: ^1.6.1
  syncpack: ^15.3.2
  typescript: npm:@typescript/typescript6@^6.0.2
  vitest: ^4.1.8
  yaml: ^2.9.0
  zod: ^4.4.3

minimumReleaseAgeExclude:
  - '@earendil-works/pi-agent-core@0.80.5'
  - '@earendil-works/pi-ai@0.80.5'
  - '@earendil-works/pi-coding-agent@0.80.5'
  - '@earendil-works/pi-tui@0.80.5'
