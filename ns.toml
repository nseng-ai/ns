[areg]
agents = ["codex", "claude-code"]

[slots]
provision = [".env.local", ".vercel/project.json"]

[dispatch]
harness = "pi"
# Vercel project: Internal Playground (vercel-internal-playground) / ns-dispatch.
vercel_project_id = "prj_mDk2YJj2o9rGd8G9q49qHsU1Ebq2"
# Vercel team: Internal Playground (vercel-internal-playground).
vercel_team_id = "team_TtmJZYmD3tcLBLqWOhoVawd1"
workflow_dashboard_url = "https://vercel.com/vercel-internal-playground/ns-dispatch/workflows"
deployment_url = "https://ns-dispatch.playground-vercel.tools"
anchor_timezone = "America/Los_Angeles"

[reviews.diff]
exclude = [
  ".agents/skills/**/*.py",
  ".claude/skills/**/*.py",
]

[models.profiles.ultrafast]
model = "vercel-ai-gateway/openai/gpt-5.6-luna"
thinking = "off"

[models.profiles.fast]
model = "vercel-ai-gateway/openai/gpt-5.6-luna"
thinking = "medium"

[models.profiles.standard]
model = "vercel-ai-gateway/openai/gpt-5.6-terra"
thinking = "medium"

[models.profiles.deep]
model = "vercel-ai-gateway/openai/gpt-5.6-sol"
thinking = "low"

[models.profiles.ultradeep]
model = "vercel-ai-gateway/openai/gpt-5.6-sol"
thinking = "xhigh"

[points]
"flow.submit.pre" = ["just"]
