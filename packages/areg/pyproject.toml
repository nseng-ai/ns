[project]
name = "areg"
version = "0.1.0"
description = "Skills management framework for AI coding agents."
readme = "README.md"
license = "MIT"
authors = [
  { name = "Dagster Labs", email = "hello@dagsterlabs.com" },
]
requires-python = ">=3.11"
dependencies = [
  "asdl-core",
  "click>=8.1.7",
]

[project.scripts]
areg = "areg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/areg"]
