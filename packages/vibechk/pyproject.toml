[project]
name = "vibechk"
version = "0.1.0"
description = "Lightweight agent context evaluation CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1.7",
]

[project.scripts]
vibechk = "vibechk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibechk"]
