[project]
name = "asdl-slots"
version = "0.1.0"
description = "Worktree pool manager for asdl"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1.7",
  "asdl-core",
]

[project.scripts]
slot = "asdl_slots.cli.main:main"

[project.entry-points."asdl.plugins"]
slots = "asdl_slots.cli.plugin:build_slot_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asdl_slots"]
