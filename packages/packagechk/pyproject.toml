[project]
name = "packagechk"
version = "0.1.0"
description = "Check package-name availability across registries"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1.7",
]

[project.scripts]
packagechk = "packagechk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/packagechk"]
