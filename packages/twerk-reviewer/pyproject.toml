[project]
name = "twerk-reviewer"
version = "0.1.0"
description = "Markdown-driven local reviewer for twerk"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1.7",
  "pyyaml>=6",
  "twerk-core",
]

[project.scripts]
reviewer = "twerk_reviewer.cli.main:main"

[project.entry-points."twerk.plugins"]
reviewer = "twerk_reviewer.cli.reviewer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twerk_reviewer"]
