[project]
name = "twerk-pr-address"
version = "0.1.0"
description = "PR review address operations for twerk"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1.7",
  "twerk-core",
]

[project.scripts]
pr-address = "twerk_pr_address.cli.main:main"

[project.entry-points."twerk.plugins"]
pr_address = "twerk_pr_address.cli.plugin:build_pr_address_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twerk_pr_address"]
