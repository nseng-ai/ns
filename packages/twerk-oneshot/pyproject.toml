[project]
name = "twerk-oneshot"
version = "0.1.0"
description = "One-shot remote execution scaffold for twerk"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1.7",
  "twerk-core",
]

[project.scripts]
oneshot = "twerk_oneshot.cli.main:main"

[project.entry-points."twerk.plugins"]
oneshot = "twerk_oneshot.cli.oneshot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twerk_oneshot"]
