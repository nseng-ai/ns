[project]
name = "asdl-objectives"
version = "0.1.0"
description = "Checked-in Objective records for asdl"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1.7",
  "asdl-core",
]

[project.scripts]
objective = "asdl_objectives.main:main"

[project.entry-points."asdl.plugins"]
objective = "asdl_objectives.plugin:build_objective_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asdl_objectives"]
