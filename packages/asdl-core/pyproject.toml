[project]
name = "asdl-core"
version = "0.1.0"
description = "Core utilities for asdl plugins"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1.7",
  "pydantic>=2",
  "rich>=13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asdl_core"]
