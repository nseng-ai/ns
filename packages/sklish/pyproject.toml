[project]
name = "sklish"
version = "0.1.0"
description = "Standalone installer for agent skills declared by Python packages"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1.7",
  "rich>=13.0",
]

[project.scripts]
sklish = "sklish.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sklish"]
