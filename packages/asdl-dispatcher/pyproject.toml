[project]
name = "asdl-dispatcher"
version = "0.1.0"
description = "Dispatch coding tasks to GitHub Actions"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1.7",
  "asdl-core",
]

[project.scripts]
dispatcher = "asdl_dispatcher.cli.main:main"

[project.entry-points."asdl.plugins"]
dispatcher = "asdl_dispatcher.cli.plugin:build_dispatcher_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asdl_dispatcher"]
