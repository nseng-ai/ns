[project]
name = "roaster"
version = "0.1.0"
description = "Markdown-driven local reviewer for asdl"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1.7",
  "pyyaml>=6",
  "asdl-core",
]

[project.scripts]
roaster = "roaster.cli.main:main"

[project.entry-points."asdl.plugins"]
roaster = "roaster.cli.plugin:build_reviewer_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roaster"]
