[project]
name = "asdl-reviewer"
version = "0.1.0"
description = "Markdown-driven local reviewer for asdl"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1.7",
  "pyyaml>=6",
  "asdl-core",
]

[project.scripts]
reviewer = "asdl_reviewer.cli.main:main"

[project.entry-points."asdl.plugins"]
reviewer = "asdl_reviewer.cli.plugin:build_reviewer_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asdl_reviewer"]
