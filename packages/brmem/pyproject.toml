[project]
name = "brmem"
version = "0.1.0"
description = "Branch-scoped key/value storage backed by git refs"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1.7",
  "asdl-core",
]

[project.scripts]
brmem = "brmem.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brmem"]
