[project]
name = "twerk-dispatcher"
version = "0.1.0"
description = "Dispatch coding tasks to GitHub Actions"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1.7",
  "twerk-core",
]

[project.scripts]
dispatcher = "twerk_dispatcher.cli.main:main"

[project.entry-points."twerk.plugins"]
dispatcher = "twerk_dispatcher.cli.plugin:build_dispatcher_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twerk_dispatcher"]
