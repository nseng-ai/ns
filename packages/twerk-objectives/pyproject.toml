[project]
name = "twerk-objectives"
version = "0.1.0"
description = "Branch-scoped planning documents for twerk"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1.7",
  "twerk-core",
  "brmem",
]

[project.scripts]
objective = "twerk_objectives.main:main"

[project.entry-points."twerk.plugins"]
objective = "twerk_objectives.plugin:build_objective_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twerk_objectives"]
