[project]
name = "twerk-objectives"
version = "0.1.0"
description = "Objective management plugin for twerk"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1.7",
  "twerk-core",
]

[project.scripts]
objective = "twerk_objectives.cli.main:main"

[project.entry-points."twerk.plugins"]
objectives = "twerk_objectives.cli.objective.group:build_objective_group"

[project.entry-points."sklish.skills"]
"dagster-io/twerk" = "objective objective-create objective-list objective-progress objective-reconcile"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twerk_objectives"]
