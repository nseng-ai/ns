[project]
name = "asdl-pr-address"
version = "0.1.0"
description = "PR review address operations for asdl"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1.7",
  "asdl-core",
]

[project.scripts]
# Named pr-address-py so the TypeScript `pr-address` shim (installed by
# `just install-pr-address`) is not shadowed by .venv/bin inside the repo.
pr-address-py = "asdl_pr_address.cli.main:main"

[project.entry-points."asdl.plugins"]
pr_address = "asdl_pr_address.cli.plugin:build_pr_address_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asdl_pr_address"]
