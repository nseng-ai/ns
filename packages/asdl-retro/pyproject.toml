[project]
name = "asdl-retro"
version = "0.1.0"
description = "Branch session retrospective evidence operations for asdl"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1.7",
  "asdl-core",
]

[project.scripts]
branch-retro = "asdl_retro.main:main"

[project.entry-points."asdl.plugins"]
branch_retro = "asdl_retro.plugin:build_branch_retro_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asdl_retro"]
