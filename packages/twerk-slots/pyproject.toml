[project]
name = "twerk-slots"
version = "0.1.0"
description = "Worktree pool manager for twerk"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1.7",
  "twerk-core",
]

[project.scripts]
slot = "twerk_slots.cli.main:main"

[project.entry-points."twerk.plugins"]
slots = "twerk_slots.cli.plugin:build_slot_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twerk_slots"]
