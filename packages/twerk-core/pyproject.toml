[project]
name = "twerk-core"
version = "0.1.0"
description = "Core utilities for twerk plugins"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1.7",
  "rich>=13.0",
]

[project.scripts]
brmem = "twerk_core.brmem.main:main"
objective = "twerk_core.objective.main:main"

[project.entry-points."twerk.plugins"]
objective = "twerk_core.objective.plugin:build_objective_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twerk_core"]
