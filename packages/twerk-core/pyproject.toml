[project]
name = "twerk-core"
version = "0.1.0"
description = "Core utilities for twerk plugins"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twerk_core"]
