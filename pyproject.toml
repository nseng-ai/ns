[tool.uv.workspace]
members = [
  "packages/twerk-core",
  "packages/twerk-dispatcher",
  "packages/twerk-objectives",
  "packages/twerk-pr-address",
  "packages/twerk-reviewer",
  "packages/twerk-slots",
]

[tool.uv.sources]
twerk-core = { workspace = true }
twerk-dispatcher = { workspace = true }
twerk-objectives = { workspace = true }
twerk-pr-address = { workspace = true }
twerk-reviewer = { workspace = true }
twerk-slots = { workspace = true }

[project]
name = "twerk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
  { name = "Dagster Labs", email = "hello@dagsterlabs.com" },
]
requires-python = ">=3.11"
dependencies = [
  "click>=8.1.7",
  "twerk-core",
]

[project.scripts]
twerk = "twerk.cli.cli:main"

[project.optional-dependencies]
plugins = [
  "twerk-dispatcher",
  "twerk-objectives",
  "twerk-pr-address",
  "twerk-slots",
]

[dependency-groups]
dev = [
  "nonslop",
  "ruff>=0.5.0",
  "pytest>=8.0.0",
  "pytest-xdist>=3.8.0",
  "twerk-core",
  "twerk-dispatcher",
  "twerk-objectives",
  "twerk-pr-address",
  "twerk-reviewer",
  "twerk-slots",
  "ty>=0.0.1a7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twerk"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = [
  "src",
  "packages/twerk-core/src",
  "packages/twerk-dispatcher/src",
  "packages/twerk-objectives/src",
  "packages/twerk-pr-address/src",
  "packages/twerk-reviewer/src",
  "packages/twerk-slots/src",
]
exclude = [".claude/", ".agents/skills/"]
force-exclude = true

[tool.ruff.lint]
select = [
  "E", # pycodestyle errors
  "F", # pyflakes
  "I", # isort (import sorting)
  "UP", # pyupgrade
  "B", # flake8-bugbear
]

[tool.ruff.lint.isort]
known-first-party = [
  "twerk",
  "twerk_core",
  "twerk_dispatcher",
  "twerk_objectives",
  "twerk_pr_address",
  "twerk_reviewer",
  "twerk_slots",
]

[tool.ty.src]
include = ["src", "packages/*/src"]
exclude = [".agents/skills/", ".claude/skills/"]

[tool.ty.environment]
python-version = "3.11"
python = ".venv"

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = [
  "tests",
  "packages/twerk-core/tests",
  "packages/twerk-dispatcher/tests",
  "packages/twerk-objectives/tests",
  "packages/twerk-pr-address/tests",
  "packages/twerk-reviewer/tests",
  "packages/twerk-slots/tests",
]
