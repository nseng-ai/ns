[tool.uv.workspace]
members = [
  "packages/asdl-core",
]

[tool.uv.sources]
asdl-core = { workspace = true }

[project]
name = "asdl-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
  { name = "Dagster Labs", email = "hello@dagsterlabs.com" },
]
requires-python = ">=3.11"
dependencies = [
  "click>=8.1.7",
  "asdl-core",
]

[project.scripts]
asdl = "asdl_tools.cli.cli:main"

[dependency-groups]
dev = [
  "ruff>=0.5.0",
  "pytest>=8.0.0",
  "pytest-xdist>=3.8.0",
  "asdl-core",
  "ty>=0.0.1a7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asdl_tools"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = [
  "src",
  "packages/asdl-core/src",
]
exclude = [".git/", ".claude/", ".agents/skills/"]
force-exclude = true

[tool.ruff.lint]
select = [
  "E", # pycodestyle errors
  "F", # pyflakes
  "I", # isort (import sorting)
  "UP", # pyupgrade
  "B", # flake8-bugbear
]

[tool.ruff.lint.isort]
known-first-party = [
  "asdl_tools",
  "asdl_core",
]

[tool.ty.src]
include = [
  "src",
  "packages/asdl-core/src",
]
exclude = [".agents/skills/", ".claude/skills/"]

[tool.ty.environment]
python-version = "3.11"
python = ".venv"

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
markers = [
  "live_github: opt-in live GitHub conformance tests",
  "live_github_mutating: live GitHub conformance tests that mutate ephemeral fixtures",
]
testpaths = [
  "tests",
  "packages/asdl-core/tests",
]
