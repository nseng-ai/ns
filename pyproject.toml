[tool.uv.workspace]
members = [
  "packages/brmem",
  "packages/asdl-core",
  "packages/asdl-dispatcher",
  "packages/asdl-objectives",
  "packages/asdl-pr-address",
  "packages/asdl-reviewer",
  "packages/asdl-slots",
  "packages/packagechk",
]

[tool.uv.sources]
brmem = { workspace = true }
asdl-core = { workspace = true }
asdl-dispatcher = { workspace = true }
asdl-objectives = { workspace = true }
asdl-pr-address = { workspace = true }
asdl-reviewer = { workspace = true }
asdl-slots = { workspace = true }
packagechk = { workspace = true }

[project]
name = "asdl-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
  { name = "Dagster Labs", email = "hello@dagsterlabs.com" },
]
requires-python = ">=3.11"
dependencies = [
  "click>=8.1.7",
  "asdl-core",
]

[project.scripts]
asdl = "asdl_tools.cli.cli:main"

[project.optional-dependencies]
plugins = [
  "asdl-dispatcher",
  "asdl-objectives",
  "asdl-pr-address",
  "asdl-slots",
]

[dependency-groups]
dev = [
  "brmem",
  "nonslop",
  "ruff>=0.5.0",
  "pytest>=8.0.0",
  "pytest-xdist>=3.8.0",
  "asdl-core",
  "asdl-dispatcher",
  "asdl-objectives",
  "asdl-pr-address",
  "asdl-reviewer",
  "asdl-slots",
  "packagechk",
  "ty>=0.0.1a7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asdl_tools"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = [
  "src",
  "packages/brmem/src",
  "packages/asdl-core/src",
  "packages/asdl-dispatcher/src",
  "packages/asdl-objectives/src",
  "packages/asdl-pr-address/src",
  "packages/asdl-reviewer/src",
  "packages/asdl-slots/src",
  "packages/packagechk/src",
]
exclude = [".claude/", ".agents/skills/"]
force-exclude = true

[tool.ruff.lint]
select = [
  "E", # pycodestyle errors
  "F", # pyflakes
  "I", # isort (import sorting)
  "UP", # pyupgrade
  "B", # flake8-bugbear
]

[tool.ruff.lint.isort]
known-first-party = [
  "brmem",
  "asdl_tools",
  "asdl_core",
  "asdl_dispatcher",
  "asdl_objectives",
  "asdl_pr_address",
  "asdl_reviewer",
  "asdl_slots",
  "packagechk",
]

[tool.ty.src]
include = ["src", "packages/*/src"]
exclude = [".agents/skills/", ".claude/skills/"]

[tool.ty.environment]
python-version = "3.11"
python = ".venv"

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
markers = [
  "live_github: opt-in live GitHub conformance tests",
  "live_github_mutating: live GitHub conformance tests that mutate ephemeral fixtures",
]
testpaths = [
  "tests",
  "packages/brmem/tests",
  "packages/asdl-core/tests",
  "packages/asdl-dispatcher/tests",
  "packages/asdl-objectives/tests",
  "packages/asdl-pr-address/tests",
  "packages/asdl-reviewer/tests",
  "packages/asdl-slots/tests",
  "packages/packagechk/tests",
]
